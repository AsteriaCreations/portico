# Portico -- Apache + mod_php config for a production LAN check-in server.
#
# Plain Apache Lounge httpd 2.4 (win64 / VS17 / x64) + a Thread Safe PHP 8.4
# build at C:\php. Full context: docs/DEPLOYMENT.md, "Serving the app on the LAN".
#
# One-time install -- run  scripts\apache\setup-apache.ps1  (elevated) to do all
# of the below automatically and idempotently, or do it by hand:
#   1. Copy this file to        C:\Apache24\conf\extra\portico.conf
#   2. In C:\Apache24\conf\httpd.conf:
#        - change the stock  "Listen 80"  line to  "Listen <LAN-IP>:80"
#        - add at the end:    Include conf/extra/portico.conf
#      (do NOT also uncomment rewrite_module there -- this file loads it)
#   3. In C:\php\php.ini: set  extension_dir = "ext" , then uncomment
#        extension=curl  fileinfo  gd  intl  mbstring  openssl  pdo_mysql
#        exif  zip  bcmath
#      (php.ini is version-specific, so it is not tracked here; the runtime
#      tunables that DO matter are set as php_admin_value below.)
#   4. C:\Apache24\bin\httpd.exe -t
#      C:\Apache24\bin\httpd.exe -k install -n "Apache-Portico"
#      sc config "Apache-Portico" start= auto obj= "HOST\serviceaccount" password= <pw>
#      C:\Apache24\bin\httpd.exe -k start -n "Apache-Portico"
#
# Set the four paths / IP / hostname / VLAN CIDR below for your box. The example
# values use the documentation-only ranges from RFC 5737 (192.0.2.0/24) and
# RFC 6762 (.lan) -- replace them.

Define SITE_ROOT "C:/portico/public"
Define SITE_IP   "192.0.2.10"
Define SITE_HOST "checkin.example.lan"
Define SITE_LAN  "192.0.2.0/24"

# --- modules -----------------------------------------------------------------
# php_module is not present in stock httpd.conf; rewrite_module ships commented.
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php_module "C:/php/php8apache2_4.dll"
AddHandler application/x-httpd-php .php
PHPIniDir "C:/php"

# Global ServerName, so Apache doesn't warn about the FQDN at startup.
ServerName ${SITE_HOST}:80

<VirtualHost ${SITE_IP}:80>
    ServerName ${SITE_HOST}
    DocumentRoot "${SITE_ROOT}"
    DirectoryIndex index.php

    # Laravel front-controller routing comes from public/.htaccess (mod_rewrite).
    <Directory "${SITE_ROOT}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        # Web-layer echo of your network's VLAN / client-isolation firewall rule
        # -- defence in depth, not the primary boundary.
        Require ip ${SITE_LAN}
        Require local
    </Directory>

    # File-upload ceiling for member / prepay-list imports.
    php_admin_value upload_max_filesize 512M
    php_admin_value post_max_size 512M
    php_admin_value memory_limit 256M
    php_admin_value date.timezone "America/Chicago"

    ErrorLog  "C:/Apache24/logs/portico-error.log"
    CustomLog "C:/Apache24/logs/portico-access.log" combined
</VirtualHost>
