# Portico -- HTTPS-enabled variant of portico.conf, for a LAN check-in server
# using a locally-trusted cert (mkcert or a small internal CA) instead of
# plain HTTP.
#
# This file is NOT included by default and setup-apache.ps1 does not read it
# automatically -- it's a worked starting point. To use it:
#   1. Copy it to your own overlay filename (e.g. scripts/apache/<yourclub>.conf)
#      and fill in the four Define values for your box, same as portico.conf.
#   2. Get a cert/key pair for SITE_HOST (mkcert <host> <ip> is the easiest --
#      see scripts/client/install-local-ca.ps1 for trusting mkcert's CA on
#      staff devices afterward).
#   3. Run:
#        setup-apache.ps1 -ConfFile '<yourclub>.conf' -EnableTls `
#            -CertFile '<path to the cert>' -KeyFile '<path to the key>'
#      which copies the cert/key into place, adds "Listen <ip>:443" to
#      httpd.conf, opens the firewall for 443, and deploys this file.
#
# Why this is a separate file rather than baked into portico.conf: the :443
# vhost below needs SSLCertificateFile/SSLCertificateKeyFile to point at real
# files, and `httpd -t` fails outright if they don't exist -- so shipping this
# unconditionally in the plain-HTTP default would break every install that
# isn't using TLS. Keeping it opt-in means the default stays exactly as
# simple as before.
#
# The example values use the documentation-only ranges from RFC 5737
# (192.0.2.0/24) and RFC 6762 (.lan) -- replace them.

Define SITE_ROOT "C:/portico/public"
Define SITE_IP   "192.0.2.10"
Define SITE_HOST "checkin.example.lan"
Define SITE_LAN  "192.0.2.0/24"
Define SITE_CERT "C:/Apache24/conf/ssl/site.pem"
Define SITE_KEY  "C:/Apache24/conf/ssl/site-key.pem"

# --- modules -----------------------------------------------------------------
# php_module is not present in stock httpd.conf; rewrite_module/ssl_module/
# socache_shmcb_module/headers_module ship commented. socache_shmcb_module is
# required by SSLSessionCache "shmcb:..." below -- omitting it fails
# `httpd -t` with "'shmcb' session cache not supported".
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule headers_module modules/mod_headers.so
LoadModule php_module "C:/php/php8apache2_4.dll"
AddHandler application/x-httpd-php .php
PHPIniDir "C:/php"

SSLSessionCache "shmcb:C:/Apache24/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# Global ServerName, so Apache doesn't warn about the FQDN at startup.
ServerName ${SITE_HOST}:80

# Plain HTTP redirects to HTTPS rather than serving the app, so a stale
# http:// bookmark/link still works.
<VirtualHost ${SITE_IP}:80>
    ServerName ${SITE_HOST}
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost ${SITE_IP}:443>
    ServerName ${SITE_HOST}
    DocumentRoot "${SITE_ROOT}"
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile "${SITE_CERT}"
    SSLCertificateKeyFile "${SITE_KEY}"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Laravel front-controller routing comes from public/.htaccess (mod_rewrite).
    <Directory "${SITE_ROOT}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        # Web-layer echo of your network's VLAN / client-isolation firewall rule
        # -- defence in depth, not the primary boundary.
        Require ip ${SITE_LAN}
        Require local
    </Directory>

    # File-upload ceiling for member / prepay-list imports.
    php_admin_value upload_max_filesize 512M
    php_admin_value post_max_size 512M
    php_admin_value memory_limit 256M
    php_admin_value date.timezone "America/Chicago"

    ErrorLog  "C:/Apache24/logs/portico-error.log"
    CustomLog "C:/Apache24/logs/portico-access.log" combined
</VirtualHost>
