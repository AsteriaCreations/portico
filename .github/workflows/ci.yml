name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repo, so don't rely on the
# repository-level default staying read-only.
permissions:
  contents: read

# A new push to the same PR branch makes the older run moot, so cancel it
# instead of queueing behind it. Runs on main are never cancelled: each
# merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each test suite is split across three runners (Pest --shard), each running
# its share with --parallel. A private repo's runners have only 2 cores, so
# sharding is what keeps CI quick there. The rulesets require the
# un-sharded check names, so a small gate job reports each one, passing only
# when every shard passed.
jobs:
  tests:
    name: Pest (PHP ${{ matrix.php }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, exif, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # Paratest ships with Pest: one worker per runner core. Pest is called
      # directly because `artisan test --parallel` adds a --runner option
      # that --shard's test listing rejects.
      - name: Run tests
        run: vendor/bin/pest --parallel --shard=${{ matrix.shard }}/3 --display-warnings --display-notices --display-deprecations --display-errors

  tests-result:
    name: Pest (PHP 8.4)
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.tests.result }}

  migrate-mariadb:
    name: Migrate + seed (MariaDB, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: portico
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, mysqli, exif, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # The test suite always runs on in-memory SQLite (phpunit.xml). This job is
      # the only place a migration is exercised on MariaDB — the documented
      # production stack — so a MySQL-only issue (a bad column AFTER clause, an
      # enum change, an index name collision) fails CI instead of a new install.
      # Once is enough, so only the first shard does it.
      - name: Rebuild the database from scratch on MariaDB
        if: matrix.shard == 1
        run: php artisan migrate:fresh --seed --no-interaction

      - name: Seed the local-development demo dataset
        if: matrix.shard == 1
        run: php artisan db:seed --class=DemoDataSeeder --no-interaction

      # The same suite the SQLite job runs, on the production engine -- the
      # only place row locks are real. tests/Feature/CheckInConcurrencyTest.php
      # stages two-register races here and skips itself on SQLite. Real
      # environment variables win over phpunit.xml's own <env> defaults.
      # In parallel, Laravel gives each worker its own portico_test_N
      # database (root can create them), so the races stay isolated.
      - name: Run tests on MariaDB
        run: vendor/bin/pest --parallel --shard=${{ matrix.shard }}/3 --display-warnings --display-notices --display-deprecations --display-errors
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: portico
          DB_USERNAME: root
          DB_PASSWORD: ''

  migrate-mariadb-result:
    name: Migrate + seed (MariaDB)
    needs: migrate-mariadb
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.migrate-mariadb.result }}

  # The panel theme (resources/css/filament/admin/theme.css) is compiled by
  # Vite and imports Filament's base theme from vendor/, so Composer runs
  # first -- the same order as scripts/deploy.ps1. The tests never build
  # assets (TestCase::withoutVite()), so this is the only place a broken
  # theme or Vite config fails before a deploy does. Node is preinstalled on
  # the runner.
  assets:
    name: Build front-end assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, exif, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build assets
        run: npm install --no-audit --no-fund && npm run build

      - name: Check the panel theme was built
        run: grep -q '"resources/css/filament/admin/theme.css"' public/build/manifest.json

  pint:
    name: Pint (code style)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
